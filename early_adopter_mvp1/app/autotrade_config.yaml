# AutoTrader Configuration
# Modifiez ces valeurs selon vos besoins

# Configuration du réseau
network:
  type: "mainnet"  # "mainnet" ou "devnet"
  rpc_endpoints:
    mainnet:
      primary: "https://mainnet.helius-rpc.com/?api-key=09fa25c2-61df-44b7-b435-bbd2dbbae0df"
      fallback: "https://api.mainnet-beta.solana.com"
    devnet:
      primary: "https://api.devnet.solana.com"
      fallback: "https://api.devnet.solana.com"
  jupiter_api: "https://quote-api.jup.ag/v6"
  explorer_base:
    mainnet: "https://solscan.io"
    devnet: "https://solscan.io"

# Configuration de trading
trading:
  max_sol_per_trade:
    mainnet: 0.0001
    devnet: 0.1
  max_daily_budget:
    mainnet: 0.01
    devnet: 1.0
  max_simultaneous_positions: 3
  min_score_to_buy: 60
  min_confidence_level: 40
  max_token_age_minutes: 15
  
  # Gestion des risques
  stop_loss_percentage: -30
  take_profit_levels: [100, 300, 500]
  take_profit_portions: [0.5, 0.3, 0.2]
  
  # Configuration des transactions
  slippage_bps: 300
  priority_fee_lamports:
    mainnet: 100
    devnet: 50
  confirmation_timeout: 60
  confirmation_strategy: "smart"  # "basic", "smart", "aggressive"
  require_manual_confirmation:
    mainnet: true
    devnet: false

# Configuration du monitoring
monitoring:
  price_check_interval_seconds: 30
  health_check_interval_seconds: 60
  position_update_interval_seconds: 10
  
# Configuration des logs
logging:
  level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # "json" ou "text"
  file_rotation:
    enabled: true
    max_size_mb: 50
    backup_count: 5
    rotation_interval: "daily"  # "daily", "weekly", "monthly"
  log_files:
    main: "logs/autotrader.log"
    trades: "logs/trades.log"
    errors: "logs/errors.log"
    performance: "logs/performance.log"

# Configuration des notifications
notifications:
  discord:
    enabled: false
    webhook_url: ""  # Votre webhook Discord
    channels:
      trades: true      # Notifications des trades
      errors: true      # Notifications d'erreurs
      performance: true # Notifications de performance
    minimum_alert_level: "INFO"
    
  telegram:
    enabled: false
    bot_token: ""     # Token de votre bot Telegram
    chat_id: ""       # Votre chat ID Telegram
    channels:
      trades: true
      errors: true
      performance: true
    minimum_alert_level: "WARNING"

# Configuration de la base de données (optionnel)
database:
  enabled: false
  type: "sqlite"  # "sqlite", "postgresql", "mysql"
  connection:
    sqlite:
      path: "data/autotrader.db"
    postgresql:
      host: "localhost"
      port: 5432
      database: "autotrader"
      username: ""
      password: ""

# Configuration de sécurité
security:
  accept_finalized_after_timeout: true
  wallet:
    encryption_enabled: false
    key_derivation_rounds: 100000
  api:
    rate_limiting:
      enabled: true
      max_requests_per_minute: 60
  
# Configuration de développement
development:
  simulation_mode: false
  mock_transactions: false
  debug_transactions: false
  save_transaction_details: true

# Configuration des alertes
alerts:
  position_pnl_thresholds: [-20, -50, 100, 300]  # Alertes à ces % de PnL
  daily_loss_threshold: -0.005  # Alerte si perte quotidienne > 0.005 SOL
  balance_warning_threshold: 0.001  # Alerte si solde < 0.001 SOL
  consecutive_failures_threshold: 5  # Alerte après 5 échecs consécutifs


auto_sell:
  enabled: true
  check_interval_seconds: 15  # Fréquence de vérification des conditions
  
  # Conditions de vente (ordre de priorité)
  conditions:
    stop_loss:
      enabled: true
      priority: 1
      percentage: -1  # Vendre si perte >= 15%
      
    take_profit:
      enabled: true
      priority: 2
      levels:
        - percentage: 50   # Premier niveau: +50%
          sell_portion: 0.3  # Vendre 30% de la position
        - percentage: 100  # Deuxième niveau: +100%
          sell_portion: 0.5  # Vendre 50% du reste
        - percentage: 200  # Troisième niveau: +200%
          sell_portion: 1.0  # Vendre tout le reste
    
    trailing_stop:
      enabled: false
      priority: 3
      initial_percentage: -10    # Déclenche le trailing à -10%
      trail_distance: 5         # Distance de suivi en %
      
    time_based:
      enabled: true
      priority: 4
      max_hold_time_minutes: 1  # Vendre après 3h maximum
      force_sell_portion: 0.5     # Vendre 50% après ce délai
      
    price_stability:
      enabled: false
      priority: 5
      stable_duration_minutes: 30  # Prix stable pendant 30min
      max_variation_percent: 2     # Variation max de 2%
      sell_portion: 0.3           # Vendre 30% si stable
      
    volume_drop:
      enabled: false
      priority: 6
      volume_drop_threshold: 70   # Chute de volume de 70%
      sell_portion: 0.4           # Vendre 40% si volume chute

# Conditions spécifiques par réseau
  network_overrides:
    mainnet:
      stop_loss:
        percentage: -1  # Plus strict sur mainnet
      take_profit:
        levels:
          - percentage: 1
            sell_portion: 1
          - percentage: 80
            sell_portion: 0.4
          - percentage: 150
            sell_portion: 1.0
    devnet:
      stop_loss:
        percentage: -20  # Plus tolérant sur devnet
      time_based:
        max_hold_time_minutes: 60  # Vendre plus vite sur devnet


  
